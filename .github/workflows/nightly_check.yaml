name: Nightly Docker image vulnerability check

# Resolves the latest semver tag and builds the image from that ref, then runs
# Trivy against it. Nothing is pushed; this is a daily probe for new CVEs in
# the released image's base layers and dependencies.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  resolve_tag:
    name: Resolve latest tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          git fetch --tags
          TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve_tag
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    secrets: inherit
    with:
      image: ilm-signing/csc-api
      cache-scope: csc-api-nightly
      ref: ${{ needs.resolve_tag.outputs.tag }}
